name: JUnit5 Maven Tests

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  create-filter:
    name: Create tests filter (Python)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install testit-cli
      run: pip install testit-cli
    
    - name: Create tests filter
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        testit autotests_filter \
          --url ${{ secrets.TMS_URL }} \
          --configuration-id ${{ github.event.client_payload.configuration_id[0] }} \
          --testrun-id ${{ github.event.client_payload.test_run_id }} \
          --framework maven-junit5 \
          --output tmp/filter.txt
        
        # Преобразуем формат для Maven
        sed -i 's/\./#/g' tmp/filter.txt
        sed -i 's/^/-Dtest=/' tmp/filter.txt
        
        echo "Modified filter content:"
        cat tmp/filter.txt
    
    - name: Upload filter artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-filter
        path: tmp/filter.txt
        retention-days: 1

  run-tests:
    name: Run JUnit5 tests (Java)
    runs-on: ubuntu-latest
    needs: create-filter
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download filter artifact
      uses: actions/download-artifact@v4
      with:
        name: test-filter
        path: tmp/
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Show filter content
      run: |
        echo "Filter file content:"
        cat tmp/filter.txt
    
    - name: Run filtered tests
      run: |
        # Читаем фильтр и выполняем тесты
        FILTER_CONTENT=$(cat tmp/filter.txt)
        echo "Running: mvn test $FILTER_CONTENT"
        
        mvn test \
          -DtmsTestRunId=${{ github.event.client_payload.test_run_id }} \
          -DtmsAdapterMode=1 \
          -Dtms.privateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          -Dtms.url=${{ secrets.TMS_URL }} \
          $(cat tmp/filter.txt) \
          -Dsurefire.failIfNoSpecifiedTests=false