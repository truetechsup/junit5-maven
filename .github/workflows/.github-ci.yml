name: JUnit5 Maven Tests

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  create-filter:
    name: Create tests filter (Python)
    runs-on: ubuntu-latest
    
    outputs:
      filter-file: ${{ steps.filter.outputs.filter-file }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install testit-cli
      run: pip install testit-cli
    
    - name: Get data from webhook
      id: webhook-data
      run: |
        echo "TEST_RUN_ID=${{ github.event.client_payload.test_run_id }}"
        echo "PROJECT_ID=${{ github.event.client_payload.project_id }}"
        echo "CONFIGURATION_IDS=${{ github.event.client_payload.configuration_id[0] }}"
    
    - name: Create tests filter
      id: filter
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        testit autotests_filter \
          --url ${{ secrets.TMS_URL }} \
          --configuration-id ${{ github.event.client_payload.configuration_id[0] }} \
          --testrun-id ${{ github.event.client_payload.test_run_id }} \
          --framework maven-junit5 \
          --output tmp/filter.txt
        
        # Сохраняем путь к файлу для следующей джобы
        echo "filter-file=tmp/filter.txt" >> $GITHUB_OUTPUT
        
        # Показываем содержимое фильтра для отладки
        echo "Filter content:"
        cat tmp/filter.txt
    
    - name: Upload filter artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-filter
        path: tmp/filter.txt
        retention-days: 1

  run-tests:
    name: Run JUnit5 tests (Java)
    runs-on: ubuntu-latest
    needs: create-filter 
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download filter artifact
      uses: actions/download-artifact@v4
      with:
        name: test-filter
        path: tmp/
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Show filter content
      run: |
        echo "Filter file content:"
        cat tmp/filter.txt
        echo "Test command that will be executed:"
        echo "mvn test -DtmsTestRunId=${{ github.event.client_payload.test_run_id }} -DtmsAdapterMode=1 \$(cat tmp/filter.txt)"
    
    - name: Run filtered tests
      run: |
        mvn test \
          -DtmsTestRunId=${{ github.event.client_payload.test_run_id }} \
          -DtmsAdapterMode=1 \
          -Dtms.privateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          -Dtms.url=${{ secrets.TMS_URL }} \
          $(cat tmp/filter.txt)
    
    - name: Test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/
        retention-days: 7